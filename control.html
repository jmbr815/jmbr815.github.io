<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Control 4WD Omnidireccional</title>

<style>
  body {
    font-family: Arial;
    text-align: center;
    background: #f0f0f0;
  }
  button {
    width: 90px;
    height: 60px;
    font-size: 18px;
    margin: 5px;
  }
  .stop {
    background: red;
    color: white;
    width: 280px;
  }
</style>

<script>
  // 👇 IP DEL ESP32 (CAMBIAR AQUÍ)
  const ESP32_IP = "192.168.1.85";

  function send(cmd) {
    fetch(`http://${ESP32_IP}/cmd?move=${cmd}`);
  }

  function hold(id, cmd) {
    const b = document.getElementById(id);
    b.onmousedown = () => send(cmd);
    b.onmouseup = () => send("S");
    b.ontouchstart = () => send(cmd);
    b.ontouchend = () => send("S");
  }

  window.onload = () => {
    hold("FL","FL"); hold("F","F"); hold("FR","FR");
    hold("SL","SL"); hold("SR","SR");
    hold("BL","BL"); hold("B","B"); hold("BR","BR");
    hold("RL","RL"); hold("RR","RR");
  };
</script>
</head>

<body>
<h2>Carro 4WD Omnidireccional</h2>

<div>
  <button id="FL">↖</button>
  <button id="F">↑</button>
  <button id="FR">↗</button>
</div>

<div>
  <button id="SL">←</button>
  <button id="SR">→</button>
</div>

<div>
  <button id="BL">↙</button>
  <button id="B">↓</button>
  <button id="BR">↘</button>
</div>

<div>
  <button id="RL">⟲</button>
  <button id="RR">⟳</button>
</div>

<br>
<button class="stop" onclick="send('S')">STOP</button>
</body>
</html>
