<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Control ESP32</title>
<style>
  body {
    font-family: Arial;
    text-align: center;
    background: #111;
    color: white;
  }

  input {
    padding: 10px;
    font-size: 16px;
    width: 200px;
    margin-bottom: 15px;
  }

  .btn {
    width: 120px;
    height: 60px;
    margin: 10px;
    font-size: 18px;
    background: #444;
    color: white;
    border: none;
    border-radius: 10px;
  }

  .btn:active {
    background: limegreen;
    color: black;
  }
</style>
</head>
<body>

<h2>Control Omnidireccional ESP32</h2>

<input type="text" id="ip" placeholder="IP del ESP32">
<br>

<button class="btn"
  onmousedown="send('forward')"
  onmouseup="send('stop')"
  ontouchstart="send('forward')"
  ontouchend="send('stop')">⬆</button>

<br>

<button class="btn"
  onmousedown="send('left')"
  onmouseup="send('stop')"
  ontouchstart="send('left')"
  ontouchend="send('stop')">⬅</button>

<button class="btn"
  onmousedown="send('right')"
  onmouseup="send('stop')"
  ontouchstart="send('right')"
  ontouchend="send('stop')">➡</button>

<br>

<button class="btn"
  onmousedown="send('backward')"
  onmouseup="send('stop')"
  ontouchstart="send('backward')"
  ontouchend="send('stop')">⬇</button>

<script>
function send(cmd) {
  const ip = document.getElementById("ip").value;
  if (ip === "") {
    alert("Escribe la IP del ESP32");
    return;
  }
  fetch(`http://${ip}/${cmd}`).catch(err => console.log(err));
}
</script>

</body>
</html>
