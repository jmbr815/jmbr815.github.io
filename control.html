<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Control Carro 4WD Omnidireccional</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: white;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    .ip-box {
      margin-bottom: 20px;
    }

    input {
      padding: 8px;
      font-size: 16px;
      width: 200px;
      text-align: center;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-gap: 15px;
      justify-content: center;
      margin-top: 30px;
    }

    button {
      width: 100px;
      height: 100px;
      font-size: 14px;
      border: none;
      border-radius: 12px;
      background-color: #444;
      color: white;
      cursor: pointer;
      transition: background-color 0.1s, transform 0.1s;
    }

    button:active {
      transform: scale(0.95);
    }

    .active {
      background-color: #00c8ff !important;
    }

    .stop {
      background-color: #b00020;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Control 4WD Omnidireccional</h1>

  <div class="ip-box">
    <p>IP del ESP32:</p>
    <input type="text" id="ip" placeholder="192.168.1.100">
  </div>

  <div class="controls">

    <!-- Fila superior -->
    <button onmousedown="send('forward_left', this)" onmouseup="send('stop', this)">↖</button>
    <button onmousedown="send('forward', this)" onmouseup="send('stop', this)">↑</button>
    <button onmousedown="send('forward_right', this)" onmouseup="send('stop', this)">↗</button>

    <!-- Fila central -->
    <button onmousedown="send('left', this)" onmouseup="send('stop', this)">←</button>
    <button class="stop" onmousedown="send('stop', this)">STOP</button>
    <button onmousedown="send('right', this)" onmouseup="send('stop', this)">→</button>

    <!-- Fila inferior -->
    <button onmousedown="send('backward_left', this)" onmouseup="send('stop', this)">↙</button>
    <button onmousedown="send('backward', this)" onmouseup="send('stop', this)">↓</button>
    <button onmousedown="send('backward_right', this)" onmouseup="send('stop', this)">↘</button>

  </div>

  <script>
    function send(command, button) {
      const ip = document.getElementById("ip").value;

      if (!ip) {
        alert("Por favor ingresa la IP del ESP32");
        return;
      }

      clearActive();
      if (button) button.classList.add("active");

      fetch(`http://${ip}/${command}`)
        .catch(error => console.log("Error:", error));
    }

    function clearActive() {
      document.querySelectorAll("button")
        .forEach(btn => btn.classList.remove("active"));
    }

    // Si se suelta el mouse fuera del botón → STOP visual
    document.body.onmouseup = () => {
      clearActive();
    };
  </script>

</body>
</html>
